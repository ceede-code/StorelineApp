<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Store - Sign Up</title>
    <link rel="stylesheet" href="styles.css">  
    <link rel="stylesheet" href="./stylings/signup.css"> 
</head>
<body>
    <div class="login-main">
        <div class="login-heading">
            <h2>Storeline Clothing</h2>
        </div>
        <form id="signup-form">
            <div class="form-group">
                <input type="text" placeholder="Full Name" id="signup-name" required>
            </div>
            <div class="form-group">
                <input type="email" placeholder="Email" id="signup-email" required>
            </div>
            <div class="form-group">
                <input type="password" placeholder="Password" id="signup-password" minlength="6" required>
            </div>
            <button id="signup-button">Sign Up</button>
            <br>
            <a href="./login.html">go to login</a>
        </form>
    </div>

    <script type="module" src="./js/signup.js"></script>
</body>
</html>
