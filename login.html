<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Store - Login</title>
    <link rel="shortcut icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTSQTO2Q4XbkbwGaEBUaK5rQZXxtABTHpnBLEe2XM77E1Dpgept6QJnlcFg&s=10" type="image/x-icon">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="styles.css">  
    <link rel="stylesheet" href="./stylings/login.css"> 
</head>
<body>
    <div class="login-main">
        <div class="login-heading">
            <h2>Storeline Clothing Login</h2>
        </div>
        <div class="login-form">
            <form id="login-form">
                <div class="form-group">
                    <input type="email" placeholder="Email" id="email" required>
                </div>
                <div class="form-group">
                    <input type="password" placeholder="Password" id="password" required>
                </div>
                <button id="login-button">Login</button>
                <p>Don't have an account? <a href='./signup.html'>Sign Up</a></p>
            </form>
        </div>
    </div>

    <script type="module" src="./js/login.js"></script>
</body>
</html>
